<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Админ-панель | Потолок Конкурент</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="login-container" class="container">
    <h1>Админ-панель</h1>
    <form id="login-form">
      <input type="password" id="admin-password" placeholder="Пароль администратора" required>
      <button type="submit">Войти</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="admin-container" class="container" style="display: none;">
    <div class="header">
      <h1>Админ-панель</h1>
      <button id="logout-btn">Выйти</button>
    </div>

    <div class="stats">
      <div class="stat-card">
        <h3>Всего заявок</h3>
        <p id="total-requests">0</p>
      </div>
      <div class="stat-card">
        <h3>Новых</h3>
        <p id="new-requests">0</p>
      </div>
      <div class="stat-card">
        <h3>Закрытых</h3>
        <p id="closed-requests">0</p>
      </div>
    </div>

    <div class="table-container">
      <table id="requests-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Имя</th>
            <th>Телефон</th>
            <th>Тип</th>
            <th>Ориентировочная стоимость</th>
            <th>Партнёр</th>
            <th>Статус</th>
            <th>Сумма договора</th>
            <th>Дата</th>
            <th>Действия</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>

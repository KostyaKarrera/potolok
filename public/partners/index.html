<!DOCTYPE html>
<html lang="ru">
<head>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
  <meta charset="UTF-8">
  <title>Партнёрская программа | Потолок КонкурентЪ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <h1>Партнёрская программа</h1>
    <p class="auth-subtitle">Регистрируйтесь, делитесь ссылкой и получайте кешбек 5% от закрытых сделок.</p>

    <div class="tabs">
      <button id="tab-register" class="active">Регистрация</button>
      <button id="tab-login">У меня уже есть доступ</button>
    </div>

    <form id="register-form" class="auth-form">
      <label class="field">
        <span>Имя или название организации (мин. 3 символа)</span>
        <input type="text" id="reg-name" placeholder="Например, Иван или Студия Света" minlength="3" required>
      </label>
      <label class="field">
        <span>Придумайте пароль (мин. 6 символов)</span>
        <input type="password" id="reg-password" placeholder="Пароль для входа в кабинет" minlength="6" required>
      </label>
      <button type="submit" class="primary-btn">Стать партнёром</button>
    </form>

    <form id="login-form" class="auth-form" style="display:none;">
      <label class="field">
        <span>Имя</span>
        <input type="text" id="login-name" placeholder="Введите имя из регистрации" required>
      </label>
      <label class="field">
        <span>Пароль</span>
        <input type="password" id="login-password" placeholder="Ваш пароль" required>
      </label>
      <button type="submit" class="primary-btn">Войти</button>
    </form>

    <p id="auth-message" class="message" role="alert"></p>
  </div>

  <script src="partner.js"></script>
</body>
</html>
